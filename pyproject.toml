[project]
name = "expedia-recsys"
version = "0.1.0"
description = "Stage 1 pipeline for Expedia Hotel Recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5,<2.0",
]

[project.scripts]
expedia-recsys = "expedia_recsys.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expedia_recsys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

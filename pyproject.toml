[project]
name = "expedia-recsys"
version = "0.2.0"
description = "Memory-safe candidate generation and LambdaRank pipeline for Expedia Hotel Recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3,<2.0",
    "lightgbm>=4.6,<5.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
]

[project.scripts]
expedia-recsys = "expedia_recsys.cli:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expedia_recsys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/overnight_max.py" = ["E501", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
